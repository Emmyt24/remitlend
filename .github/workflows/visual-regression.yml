name: Visual Regression

# Issue #111 — block PRs on unreviewed visual diffs.
# Mark this job as a required status check in branch protection so a PR
# cannot merge while the screenshots differ from the committed baselines.
#
# Issue #334 — also exercise right-to-left (RTL) and long-string layout
# validation. The visual suite runs once per locale/direction matrix entry so
# RTL rendering and overflow/truncation regressions are caught before merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/visual-regression.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ltr
            locale: en-US
            direction: ltr
          - name: rtl
            locale: ar-EG
            direction: rtl
    name: visual (${{ matrix.name }})
    env:
      VISUAL_LOCALE: ${{ matrix.locale }}
      VISUAL_DIRECTION: ${{ matrix.direction }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report-${{ matrix.name }}
          path: frontend/playwright-report/
          retention-days: 7
