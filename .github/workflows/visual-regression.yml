name: Visual Regression

# Issue #111 — block PRs on unreviewed visual diffs.
# Issue #343 — extend coverage to critical financial states (success,
# authorization failure, boundary values, retries, stale data, dependency
# failure) and surface diagnostics for triage.
# Mark this job as a required status check in branch protection so a PR
# cannot merge while the screenshots differ from the committed baselines.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/visual-regression.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload visual diff artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diffs
          path: |
            frontend/test-results/
            frontend/**/*-diff.png
            frontend/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize visual regression failures
        if: ${{ failure() }}
        run: |
          {
            echo "## Visual regression failures"
            echo ""
            echo "Critical financial states are covered by the visual suite. Review the"
            echo "uploaded \`playwright-visual-report\` and \`playwright-visual-diffs\` artifacts"
            echo "before approving any baseline update."
            echo ""
            echo "Covered states: success, authorization failure, boundary values,"
            echo "retries, stale data, dependency failure."
          } >> "$GITHUB_STEP_SUMMARY"
